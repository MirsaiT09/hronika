# Автообновление расписания на GitHub Pages: дважды в день скачивает файлы с mgsu.ru,
# разбирает их и, если что-то поменялось (пары, группы, появилась сессия), выкладывает на сайт.
# В репозитории лежит как .github/workflows/update-schedule.yml, скрипты — в папке tools/.
name: Обновить расписание
on:
  schedule: [{ cron: '0 4,16 * * *' }]   # 07:00 и 19:00 по Москве
  workflow_dispatch: {}                   # кнопка «Run workflow» — обновить прямо сейчас
permissions: { contents: write }
concurrency: { group: schedule, cancel-in-progress: false }
jobs:
  update:
    runs-on: macos-latest                 # PDF разбирается через PDFKit (tools/pdflines.swift)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy pillow
      - name: Скачать и разобрать расписание
        run: python tools/update_schedule.py --out .
      - name: Выложить, если изменилось
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add data.js data
          # дата обновления в data.js меняется каждый день — коммитим, только если поменялось что-то ещё
          if ! git diff --cached --quiet -- data || [ "$(git diff --cached -- data.js | grep '^[-+]window' | sed -E 's/"updated":"[0-9-]+"//; s/^[-+]//' | sort -u | wc -l)" -gt 1 ]; then
            git commit -m "Расписание обновлено $(date +%F)"
            git push
          else
            echo "Без изменений"
          fi
